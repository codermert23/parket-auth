<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ParkEt</title>
<style>
  :root{
    --bg:#F6F8F3; --surface:#FFFFFF; --surface-2:#EEF3EC;
    --text:#152318; --text-muted:#57685A; --border:#DEE6DB;
    --accent:#1E8449; --accent-soft:#E5F4EA;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1F0F; --surface:#152717; --surface-2:#1E3320;
      --text:#ECF0F1; --text-muted:#B9C6BA; --border:#2C4A2E;
      --accent:#3FD07E; --accent-soft:#1E3320;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1F0F; --surface:#152717; --surface-2:#1E3320;
    --text:#ECF0F1; --text-muted:#B9C6BA; --border:#2C4A2E;
    --accent:#3FD07E; --accent-soft:#1E3320;
  }
  * { box-sizing: border-box; }
  body{
    background:var(--bg); color:var(--text); margin:0;
    font-family:"Manrope", "Segoe UI", system-ui, sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .page{ max-width:480px; width:100%; text-align:center; }
  .logo{
    width:72px; height:72px; border-radius:20px;
    background:var(--accent-soft); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:34px; margin:0 auto 18px;
  }
  h1{ font-size:28px; font-weight:800; margin:0 0 10px; }
  .lede{ color:var(--text-muted); font-size:15px; line-height:1.6; margin:0 0 28px; }
  .links{ display:flex; flex-direction:column; gap:10px; }
  .links a{
    display:block; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:14px 18px; text-align:left;
    color:var(--text); text-decoration:none; font-weight:700; font-size:14px;
    transition:border-color .15s;
  }
  .links a:hover{ border-color:var(--accent); }
  .links a span.sub{
    display:block; color:var(--text-muted); font-weight:500; font-size:12.5px; margin-top:2px;
  }
  footer{ margin-top:28px; color:var(--text-muted); font-size:12.5px; }
  footer a{ color:var(--accent); text-decoration:none; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
</head>
<body>
<div class="page">
  <div class="logo">🅿️</div>
  <h1>ParkEt</h1>
  <p class="lede">Sürücülerin boşalan park yerlerini birbirine bildirdiği topluluk uygulaması.</p>

  <div class="links">
    <a href="/privacy.html">Gizlilik Politikası<span class="sub">Hangi veriyi topluyoruz, neden, ne kadar saklıyoruz</span></a>
    <a href="/hesap-silme.html">Hesap Silme<span class="sub">Hesabını ve verilerini kalıcı olarak sil</span></a>
  </div>

  <footer>ParkEt · <a href="mailto:mert.ismet.ozel@gmail.com">mert.ismet.ozel@gmail.com</a></footer>
</div>
</body>
</html>

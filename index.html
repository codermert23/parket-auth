<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParkEt – Şifre Sıfırla</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1f14; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .card {
      background: #152a1e; border: 1px solid #2a4a35;
      border-radius: 20px; padding: 36px 32px;
      width: 100%; max-width: 400px; text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h2 { color: #4ade80; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .sub { color: #6b8f79; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
    label { display: block; text-align: left; color: #8ab59a; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; padding: 13px 14px; background: #1e3a28;
      border: 1px solid #2a4a35; border-radius: 12px;
      color: #e8f5e9; font-size: 14px; outline: none;
      margin-bottom: 16px; transition: border-color 0.2s;
    }
    input:focus { border-color: #4ade80; }
    .err { color: #f87171; font-size: 12px; margin-top: -10px; margin-bottom: 14px; text-align: left; }
    button {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #4ade80, #22c55e);
      color: #0d1f14; font-size: 15px; font-weight: 700;
      border: none; border-radius: 14px; cursor: pointer; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #2a4a35;
      border-top-color: #4ade80; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card" id="root">
  <div class="spinner"></div>
  <p style="color:#6b8f79;font-size:14px;">Doğrulanıyor…</p>
</div>

<script>
  const SUPABASE_URL  = 'https://fnjrllimqrlprxoifevz.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_e6KSlqqjma2stp2v2bHRIQ_aW3drTGx';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  function showForm() {
    document.getElementById('root').innerHTML = `
      <div class="icon">🔑</div>
      <h2>Yeni Şifre Belirle</h2>
      <p class="sub">Hesabın için yeni bir şifre oluştur.</p>
      <label>Yeni Şifre</label>
      <input type="password" id="p1" placeholder="••••••••" />
      <label>Şifre Tekrar</label>
      <input type="password" id="p2" placeholder="••••••••" />
      <p class="err" id="ferr"></p>
      <button onclick="save()">Şifreyi Güncelle</button>
    `;
  }

  function showError() {
    document.getElementById('root').innerHTML = `
      <div class="icon">⚠️</div>
      <h2>Link Geçersiz</h2>
      <p class="sub">Link süresi dolmuş veya geçersiz.<br>Uygulamadan tekrar şifre sıfırlama talebinde bulun.</p>
    `;
  }

  async function save() {
    const p1 = document.getElementById('p1').value;
    const p2 = document.getElementById('p2').value;
    const e  = document.getElementById('ferr');
    e.textContent = '';
    if (p1.length < 6) { e.textContent = 'Şifre en az 6 karakter olmalı.'; return; }
    if (p1 !== p2)      { e.textContent = 'Şifreler eşleşmiyor.'; return; }

    const btn = document.querySelector('button');
    btn.disabled = true; btn.textContent = 'Güncelleniyor…';

    const { error } = await db.auth.updateUser({ password: p1 });
    if (error) {
      e.textContent = 'Hata: ' + error.message;
      btn.disabled = false; btn.textContent = 'Şifreyi Güncelle';
    } else {
      document.getElementById('root').innerHTML = `
        <div class="icon">✅</div>
        <h2>Şifre Güncellendi</h2>
        <p class="sub">Yeni şifrenle uygulamaya giriş yapabilirsin.</p>
      `;
    }
  }

  // Önce onAuthStateChange dinle (asıl yöntem)
  let done = false;
  db.auth.onAuthStateChange((event, session) => {
    if (done) return;
    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
      done = true;
      showForm();
    }
  });

  // 4 saniye içinde event gelmezse session'a bak
  setTimeout(async () => {
    if (done) return;
    const { data: { session } } = await db.auth.getSession();
    done = true;
    session ? showForm() : showError();
  }, 4000);
</script>
</body>
</html>
  init();
</script>
</body>
</html>
